# BRAIN API client settings (brain_api.py). Connection behaviour only, not policy
# thresholds. Login details come from environment variables (see README), never this file.

# Sent with every simulation. region, universe, delay, decay, neutralization and
# truncation come from each candidate and must not be listed here.
# Keys and values match BRAIN's own sample simulation (tests/fixtures/brain_api_samples).
# `cli brain options` lists every allowed value for the account.
# TODO(open-question) OQ-12: BRAIN also accepts testPeriod (ISO duration, e.g. "P1Y0M0D"),
# which holds out the last part of its simulation period. Not set until the owner decides.
settings:
  instrumentType: EQUITY
  pasteurization: "ON"
  unitHandling: VERIFY
  nanHandling: "OFF"
  language: FASTEXPR
  visualization: false

request_timeout_seconds: 60
recordset_max_wait_seconds: 300     # waiting on Retry-After for PnL, yearly stats, correlations
rate_limit_max_wait_seconds: 900    # total wait on 429 (too many concurrent simulations) per request
fetch_self_correlation: true
# GET /alphas/<id>/check after each simulation: BRAIN's final submission checks. At consultant
# level the checks inside a fresh simulation are provisional (LOW_SHARPE WARNING there, FAIL
# here; SELF_CORRELATION PENDING there, a value here), so these replace them.
fetch_submission_check: true
check_max_wait_seconds: 600
# BRAIN failure messages that are BRAIN's own trouble, not the alpha's: such a simulation is
# submitted once more (run rs20261111174623 lost one to the first message).
retry_error_messages:
  - "There was an error while running the simulation"

# Saved BRAIN session: after a login (with BRAIN's biometric check) the session cookie is
# saved here and reused by the next commands, so BRAIN asks to verify again only when it
# ends the session. Must be outside the repository; the file is created readable only by
# you (0600) and holds the session cookie only. null = never save. `cli brain logout`
# deletes it.
session_file: ~/.config/qip/brain_session.txt
