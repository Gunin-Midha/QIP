# BRAIN API client settings (brain_api.py). Connection behaviour only, not policy
# thresholds. Login details come from environment variables (see README), never this file.

# Sent with every simulation. region, universe, delay, decay, neutralization and
# truncation come from each candidate and must not be listed here.
# Keys and values match BRAIN's own sample simulation (tests/fixtures/brain_api_samples).
# `cli brain options` lists every allowed value for the account.
# TODO(open-question) OQ-12: BRAIN also accepts testPeriod (ISO duration, e.g. "P1Y0M0D"),
# which holds out the last part of its simulation period. Not set until the owner decides.
settings:
  instrumentType: EQUITY
  pasteurization: "ON"
  unitHandling: VERIFY
  nanHandling: "OFF"
  language: FASTEXPR
  visualization: false

request_timeout_seconds: 60
recordset_max_wait_seconds: 300     # waiting on Retry-After for PnL, yearly stats, correlations
rate_limit_max_wait_seconds: 900    # total wait on 429 (too many concurrent simulations) per request
fetch_self_correlation: true

