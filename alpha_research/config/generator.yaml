# Alpha Generator settings (Phase 3). Technical limits have values. Policy limits are
# null (= not configured, the check is skipped) until the owner decides (OQ-11).
generator:
  prompt_version: gen-v14      # written to CandidateRecord.prompt_version; bump when prompts change
  max_repair_rounds: 1         # times rejected expressions are sent back to the model for a fix
  max_paper_chars: 120000      # longer papers are cut to this many characters (null = no cut)
  max_hypotheses_per_paper: 5  # hypotheses extracted from one paper
  max_datafields_in_prompt: 120  # catalog fields listed in the prompt (was 300; a shorter prompt fits Groq's free per-minute limit)
  datafield_exploration_share: 0.3  # of those, drawn across all datasets, not by relevance (diversity)

  # Crowded fields (OQ-21, builder default 2026-11-14). A field whose BRAIN alpha count is
  # in the top 10% of its dataset (and at least min_alphas) is listed after every other
  # field and never drawn for exploration, unless the task names it; named ones are marked
  # "crowded" in the prompt. Our own alphas that failed PROD_CORRELATION mark their fields
  # crowded in that market too (from memory). Run rs20261114135300: a DEU alpha on
  # est_12m_ebi_raisednum_4wks (831 alphas; analyst7 median 1) had Sharpe 2.16, fitness
  # 2.12 and PROD_CORRELATION 0.80. percentile null = off.
  crowding:
    percentile: 0.9
    min_alphas: 50
    # Heavily used (owner 2026-11-25, OQ-23): at least this many BRAIN alphas use the field,
    # whatever its dataset's other fields do. The relative rule above flagged none of the 49
    # fields of run rs20261125130750, e.g. USA option8 skew (1,350-2,000 alphas) and AMR
    # model39's value-momentum rank (948; production correlation 0.91). Such fields keep
    # their place in the list (USA option8 is over 500 everywhere), are tagged, never drawn
    # for exploration or offered as blend partners, and cannot be an alpha's only signal
    # (structure below). null = off.
    heavy_alphas: 500

  # Structure of a fresh alpha (owner 2026-11-25). Sources = distinct non-base signal fields
  # (not groups or identifiers), +1 when it reads a price/volume field below (cap and adv20
  # only scale or tilt, so they are not listed). Fewer than min_signal_sources, or (with
  # need_uncrowded) signal fields that are all crowded or heavily used: the alpha is sent
  # back once with the reason, then dropped. Applies with BRAIN's field facts only, never
  # to repairs. Run rs20261125130750: 46% of fresh alphas had one source or none; all five
  # accepts combine two or more. Memory shows no Sharpe gain from the rule alone (fresh
  # alphas passing it: mean |Sharpe| 0.60, failing 0.64): it guards novelty; judge it by
  # `cli quality` over the next runs. null min_signal_sources = off.
  structure:
    min_signal_sources: 2
    need_uncrowded: true
    price_fields: [close, open, high, low, vwap, returns, volume]

  # Blend slots (owner 2026-11-25): this share of each batch must read two datasets (the
  # pattern of every accept so far: IND, CHN, EUR). The prompt offers up to `partners`
  # fields of other datasets whose alphas in this market reached |Sharpe| >= partner_min_sharpe
  # (raw or risk-neutralized, either sign), neither crowded nor heavily used: a little-used
  # field with shown signal, not one that is unused because it is empty (the loan and
  # short-interest fields of that run, 1-40 alphas each, gave Sharpe near 0).
  blend:
    share: 0.25
    partners: 8
    partner_min_sharpe: 1.0

  # The arm's latest simulated alphas (same dataset, region, delay) with BRAIN's numbers, in
  # the request, so the model stops repeating them (run rs20261125130750 round 1: four forms
  # of rank(skew) in one batch). 0 = off.
  history_in_prompt: 4          # about 200 characters each; prompts sit near the Groq free per-minute limit

  # Lessons from our own results, shown to the Generator by the BRAIN category of the arm's
  # dataset; "all" goes to every arm. Evidence: the DEU/GBR analyst7 rounds of 2026-11-14
  # and the EUR pv1 reversal rounds of 2026-11-15 (REPORT.md). Advice in the prompt, never a
  # rule; edit as evidence grows.
  # Per region, from BRAIN's region guides (shown after the `all` lesson). BRAIN's limits
  # themselves come from the market line of the prompt, never typed here.
  region_lessons:
    CHN: >-
      China (BRAIN's region guide): trading costs are high, so BRAIN asks for more Sharpe
      and returns here than in other regions (the bar is in the market line): prefer slower
      signals with low turnover and strong returns. Short selling is allowed only for
      eligible blue-chip stocks, so the opposite of an alpha does not mirror its
      performance: take the direction from the mechanism, never from flipping a weak
      result. Daily price limits (5-10% by stock type) stop large moves, so a price change
      measured over a day that hit the limit understates the move. Keep the Sharpe and
      returns on BRAIN's robust universe close to the full universe's, and judge whether
      the idea is new by its risk-handled (SLOW_AND_FAST) result.
  category_lessons:
    all: >-
      When you combine parts, keep their speeds alike or smooth the fast part first: each
      part enters as a rank, but a fast part (a 5-day price reversal, turnover near 50%)
      sets the blend's turnover and behaviour over a slow one (analyst revisions) and
      traded one strong year for a weak one. A part helps a blend only if it is strong in
      the years the blend is weak without being weak in the others. BRAIN rejects an alpha
      too correlated with its production alphas, and reshaping the same signal (another
      peer group, size tilt, horizon or neutralization) does not change that; new
      information does. A part from another dataset at about equal weight lowered a
      reversal's production correlation from 0.74 to 0.65, a third of the weight only to
      0.72. Such a part need not pass alone: it must carry different information and be
      sound in the large stocks. In IND a momentum-minus-reversal alpha (production
      correlation 0.73) blended 1:1 with the three-month z-score of the consensus EPS or
      net-profit estimate passed at 0.69, and its Sharpe on BRAIN's robust universe rose
      (1.01 to 1.36); blended with net-margin levels or changes, or news sentiment, it fell
      below the limit (0.53-0.97). Prefer analyst parts that cover the large stocks; at half
      weight the same part left the correlation at 0.71. Keep each alpha's search narrow
      (BRAIN's research guide): from a family of similar fields (one measure at several
      horizons or maturities, such as 30-, 120- and 360-day implied volatility) use one;
      from a group of similar operators (ts_mean, ts_median, ts_sum; ts_delta, ts_av_diff,
      ts_zscore; group_rank, group_zscore) use one; use common windows, 5, 10 or 21 days for
      a fast signal and 63, 121 or 252 for a slow one. Variants of a field, operator or
      window are for later, once a version shows signal.
    pv: >-
      Signals built only from price and volume (open, close, returns, volume, vwap) are the
      most common production alphas, so they tend to fail BRAIN's production correlation
      even when every other check passes. Pair the price idea with a part from another
      dataset (analyst revisions, fundamentals, a model score) at about equal weight, each
      part ranked the same way and a missing value set to the middle rank. Rank short-term
      price signals within industry, which held their recent years better than ranking
      within country. If the signal is weak in large stocks, multiply it by
      (0.25 + rank(cap)) rather than tilting by traded value, which cost fitness.
    analyst: >-
      Revision breadth works best as a net share: (raised minus lowered estimates) divided
      by the number of estimates, averaged over several forecast items (sales, net income,
      pre-tax profit, cash flow, dividends, EBITDA) rather than one headline item, and
      combined with recommendation breadth (raised minus lowered recommendations over their
      count). Ranked within sector, this took a Sharpe 1.2 signal to 1.9-2.3 with fitness
      up to 2.5. Revisions are priced fast: little or no smoothing (decay 1-2) and 1-week
      counts helped the most recent years more than longer windows. The single most used
      item (EBIT upgrades) added recent strength but correlates with production alphas.
      Compare revisions within sector: industry and subindustry peers cut the Sharpe by a
      third or more. As a signal on its own, revision size (change in the mean forecast)
      and fast price parts hurt; as a part blended with a price signal, the trend of the
      consensus estimate (z-score over about three months) worked well (IND). Where items come as lists (VECTOR fields), average them with vec_avg. Revision
      breadth also makes a good part to blend with a price signal: alone it can be weak in
      some years, but it adds information production price alphas do not have. Build it
      from less-used items: in CHN a retail-flow signal (production correlation 0.93 alone)
      blended with net revision breadth over four items used by 0-19 BRAIN alphas each, at
      twice the weight, passed at 0.698 (Sharpe 3.4); at equal weight it stayed at 0.84,
      and adding a heavily used analyst rating-model score to the breadth part raised it
      to 0.80 (0.76-0.82 with crowding or statistical neutralization).

  # Field roles, matched (case-insensitive) at the START of BRAIN's description of a field.
  # id: identifiers, codes, names and raw text, which carry no ranking information. They are
  # not listed in the prompt (unless the hypothesis names them), and an alpha built only
  # from them is sent back. time: dates and times of day, listed with a hint to use them for
  # event timing. Checked against all 17 downloaded catalogs (2026-11-11): 621 id and 1,291
  # time fields of ~78,000; "List of ..." and "Financial item" left out (they also name
  # real scores and heavily used anl4 fields). Run rs20261111162604 built two news alphas
  # on nws20_rp_story_event_count ("Identifies which content set the record came from").
  field_roles:
    id:
      - 'identifies\b'
      - '(a |the )?unique (\w+ )?identifier'
      - '(a |the )?mapping identifier'
      - '(the )?iso[- ]?(4217 )?currency code'
      - 'currency \(iso\)'
      - '(the )?(two|three)[- ]?(letter|character) iso'
      - '(the )?name of (the )?(company|entity|analyst|broker|issuer)'
      - '(the )?canonical name'
      - '(the )?(headline|raw text|free[- ]text)\b'
      - '(the )?passcode'
      - 'time zone\b'
      - 'replicator\b'
      - 'technical helper'
      - 'employer identification'
    time:
      - '(the )?(effective |expected |scheduled |latest |most recent )*(earnings report )?date\b'
      - '(the )?(utc |vendor )?timestamp'
      - '(the )?(utc )?time (when|at which|the|of day)'
      - '(the )?expected (earnings report )?(date|time)'
      - 'date (when|of|on which|representing)'
      - '(current )?fiscal (quarter|year|semi[- ]annual) (period )?(end )?date'
  max_output: 4096             # output cap for one model call

  # Complexity limits for generated expressions (OQ-11, policy choice)
  max_expression_depth: null
  max_operator_calls: null
  max_expression_chars: null
