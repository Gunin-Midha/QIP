# Alpha Generator settings (Phase 3). Technical limits have values. Policy limits are
# null (= not configured, the check is skipped) until the owner decides (OQ-11).
generator:
  prompt_version: gen-v1       # written to CandidateRecord.prompt_version; bump when prompts change
  max_repair_rounds: 1         # times rejected expressions are sent back to the model for a fix
  max_paper_chars: 120000      # longer papers are cut to this many characters (null = no cut)
  max_hypotheses_per_paper: 5  # hypotheses extracted from one paper
  max_datafields_in_prompt: 300  # most relevant catalog fields listed in the prompt
  max_output: 4096             # output cap for one model call

  # Complexity limits for generated expressions (OQ-11, policy choice)
  max_expression_depth: null
  max_operator_calls: null
  max_expression_chars: null
