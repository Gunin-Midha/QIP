# Levers per failure class (one per repair). repair_agent.py applies them. Mechanical
# rewrites (no model): increase_decay, tighten_truncation, lengthen_ts_window,
# wrap_in_smoothing, hump, rank_transform, volatility_scale, flip_sign, set_neutralization,
# backfill_fields, liquidity_tilt, winsorize, change_universe, and one lever per
# neutralization off the group scale: neutralize_statistical, neutralize_crowding,
# neutralize_reversion_and_momentum, neutralize_fast, neutralize_slow,
# neutralize_slow_and_fast, neutralize_country (each applies only where the alpha's region
# allows it). Any other lever is handed to the model and its answer must pass the Fast
# Expression validator.
#
# Consultant level (2026-11-11, builder's priors, OQ-18): the factor neutralizations are
# listed after the group levers they compete with, so the learner tries them and keeps them
# where they work. Lever statistics are kept per region too (lever_stats.py), so the order
# can differ between USA, EUR, ... as evidence comes in. The repair model also sees BRAIN's
# risk-neutralized Sharpe, which says whether removing BRAIN's risk factors would help.
#
# The order below is the starting prior only (builder's choice 2026-11-04, from the first
# three research runs). lever_stats.py reorders the levers from what each one did in past
# repairs (memory), and puts a lever first when it also addresses another class the alpha
# fails. `model_repair` is always tried last and `flip_sign` always first (rank_levers pins
# them, whatever the scores): once the mechanical ideas are used up, the model proposes its
# own fix, shown the past repairs of that class that worked.
#
# sharpe and fitness are repaired only for near misses (repair.near_miss_share in
# config/thresholds.yaml); far misses are rejected.
sharpe:
  - lever: flip_sign                # only when BRAIN's Sharpe is negative
    step: {}
  - lever: set_neutralization       # e.g. NONE -> SUBINDUSTRY: removes market/sector bets
    step: {to: SUBINDUSTRY}
  - lever: neutralize_statistical   # removes the common statistical factors
    step: {}
  - lever: neutralize_country       # GLB/EUR/ASI/AMR: removes country bets
    step: {}
  - lever: backfill_fields          # sparse fundamentals/options: more names carry a value
    step: {lookback: 63}
  - lever: rank_transform
    step: {}
  - lever: increase_decay
    step: {to: 8}
  - lever: model_repair
    step: {}
fitness:                            # fitness = Sharpe * sqrt(|returns| / max(turnover, 12.5%))
  - lever: increase_decay           # cut turnover toward 12.5% while keeping returns
    step: {to: 10}
  - lever: lengthen_ts_window
    step: {factor: 2}
  - lever: wrap_in_smoothing
    step: {operator: ts_decay_linear, window: 10}
  - lever: set_neutralization
    step: {to: SUBINDUSTRY}
  - lever: neutralize_slow          # slow factors: removes slow-moving exposures, keeps turnover
    step: {}
  - lever: hump
    step: {threshold: 0.01}
  - lever: model_repair
    step: {}
turnover:
  - lever: increase_decay
    step: {from: 3, to: 8}
  - lever: lengthen_ts_window
    step: {factor: 2}
  - lever: wrap_in_smoothing
    step: {operator: ts_mean, window: 5}
  - lever: hump
    step: {threshold: 0.01}
  - lever: model_repair
    step: {}
concentration:
  - lever: backfill_fields          # few names with data -> few names carry the weight
    step: {lookback: 63}
  - lever: rank_transform
    step: {}
  - lever: winsorize
    step: {std: 3}
  - lever: tighten_truncation
    step: {to: 0.05}
  - lever: model_repair
    step: {}
self_correlation:
  - lever: orthogonalize_against_pool
    step: {}
  - lever: set_neutralization
    step: {to: SUBINDUSTRY}
  - lever: neutralize_statistical   # strip what our alphas have in common with the market's factors
    step: {}
  - lever: neutralize_crowding
    step: {}
  - lever: lengthen_ts_window       # a different horizon of the same idea
    step: {factor: 3}
  - lever: model_repair
    step: {}
sub_universe:                       # the alpha must also work on the larger, liquid names
  - lever: liquidity_tilt
    step: {field: adv20}
  - lever: backfill_fields
    step: {lookback: 63}
  - lever: rank_transform
    step: {}
  - lever: change_universe
    step: {to: TOP1000}
  - lever: restrict_to_liquid_fields
    step: {}
  - lever: model_repair
    step: {}
drawdown:
  - lever: volatility_scale
    step: {window: 20}
  - lever: set_neutralization
    step: {to: SUBINDUSTRY}
  - lever: neutralize_reversion_and_momentum   # momentum crashes and reversal swings
    step: {}
  - lever: neutralize_country
    step: {}
  - lever: rank_transform
    step: {}
  - lever: model_repair
    step: {}
recent_sharpe:                      # BRAIN's LOW_2Y_SHARPE / IS_LADDER_SHARPE: the signal
                                    # weakened in the last in-sample years
  - lever: speed_up                 # trade the signal sooner: in the DEU analyst rescues
    step: {decay_to: 2, window_to: 2}   # (2026-11-14) faster smoothing lifted the 2-year
                                    # Sharpe more than any field change (1.17 -> 1.32 -> 1.35)
  - lever: neutralize_crowding      # a once-good signal decays when it gets crowded
    step: {}
  - lever: neutralize_reversion_and_momentum
    step: {}
  - lever: neutralize_statistical
    step: {}
  - lever: set_neutralization
    step: {to: SUBINDUSTRY}
  - lever: restore_recent_performance
    step: {}
  - lever: model_repair
    step: {}
prod_correlation:                   # BRAIN's PROD_CORRELATION: too close to production alphas
  - lever: neutralize_statistical   # (which we cannot see, so no pool to orthogonalize against)
    step: {}
  - lever: neutralize_crowding
    step: {}
  - lever: neutralize_reversion_and_momentum
    step: {}
  - lever: differentiate_from_production
    step: {}
  - lever: lengthen_ts_window       # a different horizon of the same idea
    step: {factor: 3}
  - lever: model_repair
    step: {}
