# Levers per failure class (one per repair). repair_agent.py applies them. Mechanical
# rewrites (no model): increase_decay, tighten_truncation, lengthen_ts_window,
# wrap_in_smoothing, hump, rank_transform, volatility_scale, flip_sign, set_neutralization,
# backfill_fields, liquidity_tilt, size_tilt, winsorize, change_universe, and one lever per
# neutralization off the group scale: neutralize_statistical, neutralize_crowding,
# neutralize_reversion_and_momentum, neutralize_fast, neutralize_slow,
# neutralize_slow_and_fast, neutralize_country (each applies only where the alpha's region
# allows it). blend_other_dataset asks the model for a partner signal from another dataset
# and builds the blend itself (repair_agent.build_blend). Any other lever is handed to the
# model and its answer must pass the Fast Expression validator.
#
# Consultant level (2026-11-11, builder's priors, OQ-18): the factor neutralizations are
# listed after the group levers they compete with, so the learner tries them and keeps them
# where they work. Lever statistics are kept per region too (lever_stats.py), so the order
# can differ between USA, EUR, ... as evidence comes in. The repair model also sees BRAIN's
# risk-neutralized Sharpe, which says whether removing BRAIN's risk factors would help.
#
# The order below is the starting prior only (builder's choice 2026-11-04, from the first
# three research runs). lever_stats.py reorders the levers from what each one did in past
# repairs (memory), and puts a lever first when it also addresses another class the alpha
# fails. `model_repair` is always tried last and `flip_sign` always first (rank_levers pins
# them, whatever the scores): once the mechanical ideas are used up, the model proposes its
# own fix, shown the past repairs of that class that worked.
#
# sharpe and fitness are repaired only for near misses (repair.near_miss_share in
# config/thresholds.yaml); far misses are rejected.
sharpe:
  - lever: flip_sign                # only when BRAIN's Sharpe is negative
    step: {}
  - lever: set_neutralization       # e.g. NONE -> SUBINDUSTRY: removes market/sector bets
    step: {to: SUBINDUSTRY}
  - lever: neutralize_statistical   # removes the common statistical factors
    step: {}
  - lever: neutralize_slow_and_fast # BRAIN's risk-neutralized stats are this setting
    step: {}                        # (BRAIN guide): first when the Sharpe is routed "factor first"
  - lever: neutralize_country       # GLB/EUR/ASI/AMR: removes country bets
    step: {}
  - lever: backfill_fields          # sparse fundamentals/options: more names carry a value
    step: {lookback: 63}
  - lever: rank_transform
    step: {}
  - lever: increase_decay
    step: {to: 8}
  # 2026-11-26 (owner; legs.py): combined alphas get their parts tested alone in a wave;
  # once measured, reweight_legs (model) drops or reweights the weak part. recipe_blend
  # reuses an accepted blend's partner of this market (mechanical); blend_other_dataset
  # writes a partner with accepted recipes from any market in its prompt (its step is the
  # prod_correlation entry's). In memory blend_other_dataset fixed sub-universe in 3 of 3
  # CHN repairs.
  - lever: drop_weak_legs           # mechanical (owner 2026-11-27): drop the parts whose
    step: {}                        # alone results show they add nothing (legs.py)
  - lever: reweight_legs
    step: {}
  - lever: recipe_blend
    step: {weight: 1.0, repeatable: true}
  - lever: blend_other_dataset
    step: {}
  - lever: model_repair
    step: {}
fitness:                            # fitness = Sharpe * sqrt(|returns| / max(turnover, 12.5%))
  - lever: increase_decay           # cut turnover toward 12.5% while keeping returns
    step: {to: 10}
  - lever: lengthen_ts_window
    step: {factor: 2}
  - lever: wrap_in_smoothing
    step: {operator: ts_decay_linear, window: 10}
  - lever: set_neutralization
    step: {to: SUBINDUSTRY}
  - lever: neutralize_slow          # slow factors: removes slow-moving exposures, keeps turnover
    step: {}
  - lever: hump
    step: {threshold: 0.01}
  # 2026-11-26 (owner; legs.py): combined alphas get their parts tested alone in a wave;
  # once measured, reweight_legs (model) drops or reweights the weak part. recipe_blend
  # reuses an accepted blend's partner of this market (mechanical); blend_other_dataset
  # writes a partner with accepted recipes from any market in its prompt (its step is the
  # prod_correlation entry's). In memory blend_other_dataset fixed sub-universe in 3 of 3
  # CHN repairs.
  - lever: drop_weak_legs           # mechanical (owner 2026-11-27): drop the parts whose
    step: {}                        # alone results show they add nothing (legs.py)
  - lever: reweight_legs
    step: {}
  - lever: recipe_blend
    step: {weight: 1.0, repeatable: true}
  - lever: blend_other_dataset
    step: {}
  - lever: model_repair
    step: {}
turnover:
  - lever: increase_decay
    step: {from: 3, to: 8}
  - lever: lengthen_ts_window
    step: {factor: 2}
  - lever: wrap_in_smoothing
    step: {operator: ts_mean, window: 5}
  - lever: hump
    step: {threshold: 0.01}
  - lever: model_repair
    step: {}
concentration:
  - lever: backfill_fields          # few names with data -> few names carry the weight
    step: {lookback: 63}
  - lever: rank_transform
    step: {}
  - lever: winsorize
    step: {std: 3}
  - lever: tighten_truncation
    step: {to: 0.05}
  - lever: model_repair
    step: {}
self_correlation:
  - lever: orthogonalize_against_pool
    step: {}
  - lever: set_neutralization
    step: {to: SUBINDUSTRY}
  - lever: neutralize_statistical   # strip what our alphas have in common with the market's factors
    step: {}
  - lever: neutralize_crowding
    step: {}
  - lever: lengthen_ts_window       # a different horizon of the same idea
    step: {factor: 3}
  - lever: model_repair
    step: {}
sub_universe:                       # the alpha must also work on the larger, liquid names
  # 2026-11-27 (owner): BRAIN's limit is a share of the alpha's own Sharpe (EUR TOP2500 0.52).
  # A part measured alone with too little large-cap Sharpe (EUR price-to-cash-flow score:
  # sub-universe / full Sharpe 0.09) is dropped first; tilts and smaller universes run only
  # when the sub-universe Sharpe alone could support a passing alpha (feasibility.py): in
  # memory a size tilt never raised the sub-universe Sharpe (13 children, at most +0.06)
  - lever: drop_weak_legs
    step: {}
  - lever: size_tilt                # x (0.25 + rank(cap)), uncentred. EUR reversal rescues
    step: {field: cap, offset: 0.25}  # (2026-11-15): sub-universe / full Sharpe 0.43 -> 0.54
                                    # (BRAIN's cutoff ~0.52 x own Sharpe) and the recent years
                                    # held; fitness falls with the tilt (1.24 at 0.5, 1.01 at 0.25)
  - lever: relative_price_change    # a price change in currency units (BRAIN's UNITS warning)
    step: {fields: [close, open, high, low, vwap]}   # lets expensive stocks dominate; as an
                                    # n-day return it weighs names alike (IND 2026-11-23)
  - lever: combo:relative_price_change+size_tilt   # the sound signal, tilted to the bigger
    step: {}                        # names the robust/sub-universe checks measure
  - lever: backfill_fields
    step: {lookback: 63}
  - lever: rank_transform
    step: {}
  - lever: liquidity_tilt           # an adv20 tilt cost fitness (0.83-1.06) and the recent
    step: {field: adv20}            # years (2-year Sharpe 1.43 vs 2.55 with cap) in EUR
  - lever: restrict_to_liquid_fields
    step: {}
  - lever: change_universe          # the smaller universe alone cut EUR's Sharpe 2.80 -> 1.03
    step: {to: TOP1000}
  # 2026-11-26 (owner; legs.py): combined alphas get their parts tested alone in a wave;
  # once measured, reweight_legs (model) drops or reweights the weak part. recipe_blend
  # reuses an accepted blend's partner of this market (mechanical); blend_other_dataset
  # writes a partner with accepted recipes from any market in its prompt (its step is the
  # prod_correlation entry's). In memory blend_other_dataset fixed sub-universe in 3 of 3
  # CHN repairs.
  - lever: drop_weak_legs           # mechanical (owner 2026-11-27): drop the parts whose
    step: {}                        # alone results show they add nothing (legs.py)
  - lever: reweight_legs
    step: {}
  - lever: recipe_blend
    step: {weight: 1.0, repeatable: true}
  - lever: blend_other_dataset
    step: {}
  - lever: model_repair
    step: {}
drawdown:
  - lever: volatility_scale
    step: {window: 20}
  - lever: set_neutralization
    step: {to: SUBINDUSTRY}
  - lever: neutralize_reversion_and_momentum   # momentum crashes and reversal swings
    step: {}
  - lever: neutralize_country
    step: {}
  - lever: rank_transform
    step: {}
  - lever: model_repair
    step: {}
recent_sharpe:                      # BRAIN's LOW_2Y_SHARPE / IS_LADDER_SHARPE: the signal
                                    # weakened in the last in-sample years
  - lever: speed_up                 # trade the signal sooner: in the DEU analyst rescues
    step: {decay_to: 2, window_to: 2}   # (2026-11-14) faster smoothing lifted the 2-year
                                    # Sharpe more than any field change (1.17 -> 1.32 -> 1.35)
  - lever: neutralize_crowding      # a once-good signal decays when it gets crowded
    step: {}
  - lever: neutralize_reversion_and_momentum
    step: {}
  - lever: neutralize_statistical
    step: {}
  - lever: set_neutralization
    step: {to: SUBINDUSTRY}
  - lever: restore_recent_performance
    step: {}
  # 2026-11-26 (owner; legs.py): combined alphas get their parts tested alone in a wave;
  # once measured, reweight_legs (model) drops or reweights the weak part. recipe_blend
  # reuses an accepted blend's partner of this market (mechanical); blend_other_dataset
  # writes a partner with accepted recipes from any market in its prompt (its step is the
  # prod_correlation entry's). In memory blend_other_dataset fixed sub-universe in 3 of 3
  # CHN repairs.
  - lever: drop_weak_legs           # mechanical (owner 2026-11-27): drop the parts whose
    step: {}                        # alone results show they add nothing (legs.py)
  - lever: reweight_legs
    step: {}
  - lever: recipe_blend
    step: {weight: 1.0, repeatable: true}
  - lever: blend_other_dataset
    step: {}
  - lever: model_repair
    step: {}
prod_correlation:                   # BRAIN's PROD_CORRELATION: too close to production alphas
                                    # (which we cannot see, so no pool to orthogonalize against)
  - lever: blend_other_dataset      # new information at equal weight. EUR reversal rescues
    step:
      weight: 1.0
      # partner weight by the parent's PROD_CORRELATION value ([at most, weight]); 2026-11-25:
      # parents at 0.73-0.74 passed with 1:1 (EUR, IND); a part at 0.93 needed 2:1 (CHN 0.698)
      weight_by_prod: [[0.78, 1.0], [1.0, 2.0]]
      exclude_categories: [pv, risk]  # the alpha's own kind of data; factor loadings
      # 0.3 (was 0.5, 2026-11-25): the blend fills a missing partner with the middle rank,
      # and the CHN partner that passed used analyst69 items at coverage 0.33-0.46
      min_coverage: 0.3
      min_alphas: 5
      prefer_low_usage: true          # less-used fields first (production alphas use the rest)
      # a quarter of the shortlist from the least crowded datasets (BRAIN value score high,
      # few BRAIN alphas; BRAIN tip 2026-11-25). A share, not a reorder: ordering by value
      # alone dropped analyst69 (value 1), the partner of the EUR accept
      value_share: 0.25
      # may blend again along a lineage, with a different partner (the model sees the
      # partners tried and their production correlation); owner 2026-11-25
      repeatable: true
      per_dataset: 8
      max_fields: 48
      # kinds of signal offered first to the model (word match on field id + description)
      topics: >-
        analyst estimate revision raised lowered upgrades downgrades recommendation buy sell
        consensus surprise profitability margin return equity assets cash flow accruals
        quality earnings yield valuation growth sentiment insider institutional ownership
        short interest borrow holdings fund
                                    # (2026-11-15): peer group, tilt, horizon and neutralization
                                    # kept it at 0.70-0.76; a third analyst blend 0.720, half 0.645
  - lever: differentiate_from_production
    step: {}
  - lever: recipe_blend             # mechanical: the partner of an accepted blend in this
    step: {weight: 1.0, repeatable: true}   # market (legs.py), no model call; 2026-11-26
  # Mechanical levers next to the model's (2026-11-25, BRAIN's tips for production
  # correlation: factor neutralization, small liquid universes). A wave takes one lever of
  # each kind, so a 4-fix wave is blend + one neutralization + one universe + one horizon.
  # Our memory (28 PROD values): STATISTICAL median 0.730 (3 of 8 under 0.7), INDUSTRY
  # 0.837; the small universes IND TOP500 (0.700) and EUR TOP1200 (0.698) lowest.
  - lever: neutralize_statistical
    step: {}
  - lever: change_universe          # next smaller (more liquid) universe of the region; only
    step: {}                        # USA, EUR, JPN, ASI have one (CHN, IND, DEU, GBR, AMR: one
                                    # universe each). BRAIN's sub-universe and robust-universe
                                    # checks and our deflated-Sharpe flag watch for overfitting
  - lever: neutralize_slow
    step: {}
  - lever: neutralize_fast
    step: {}
  - lever: neutralize_slow_and_fast
    step: {}
  - lever: neutralize_crowding
    step: {}
  - lever: neutralize_reversion_and_momentum
    step: {}
  - lever: lengthen_ts_window       # a different horizon of the same idea; did not help in EUR
    step: {factor: 3}
  - lever: model_repair
    step: {}
