# Levers per failure class, tried in order (one per repair). repair_agent.py applies them:
# increase_decay, tighten_truncation, lengthen_ts_window, wrap_in_smoothing, hump,
# rank_transform and volatility_scale are mechanical rewrites; any other lever is handed
# to the model and its answer must pass the Fast Expression validator.
turnover:
  - lever: increase_decay
    step: {from: 3, to: 8}
  - lever: lengthen_ts_window
    step: {factor: 2}
  - lever: wrap_in_smoothing
    step: {operator: ts_mean, window: 5}
  - lever: hump
    step: {threshold: 0.01}
concentration:
  - lever: rank_transform
    step: {}
  - lever: winsorize
    step: {quantile: 0.01}
  - lever: tighten_truncation
    step: {to: 0.05}
self_correlation:
  - lever: orthogonalize_against_pool
    step: {}
sub_universe:
  - lever: restrict_to_liquid_fields
    step: {}
drawdown:
  - lever: volatility_scale
    step: {window: 20}
