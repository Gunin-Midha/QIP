# Submission gates (BRAIN's pass criteria). Limits from BRAIN's own checks on our
# consultant account (live capture 2026-11-10, USA/TOP3000/delay 1): LOW_SHARPE 1.58 (1.25
# at user level), LOW_FITNESS 1.0, turnover 1%..70%, SELF_CORRELATION 0.7. BRAIN's limits can
# differ by region and delay; with use_brain_checks its own check decides per alpha.
gates:
  sharpe_min: 1.58
  fitness_min: 1.0
  turnover_min: 0.01        # 1%
  turnover_max: 0.70        # 70%
  self_correlation_max: 0.70
  use_brain_checks: true    # every PASS/FAIL check BRAIN reports is a hard gate (owner, 2026-11-04)
  # Our sharpe/fitness/turnover/self-correlation gates use the limit BRAIN reports for that
  # alpha's own check when it sends one (LOW_SHARPE, LOW_FITNESS, LOW/HIGH_TURNOVER,
  # SELF_CORRELATION), so they follow BRAIN per region and delay; the numbers above are the
  # fallback (and what the agents' prompts show). Follows "BRAIN's checks only" (2026-11-04).
  limits_from_brain: true
  # Owner 2026-11-14: "a pass has to just satisfy BRAIN's checks". Each gate above takes
  # BRAIN's own verdict for its check when BRAIN reports one (LOW_SHARPE, LOW_FITNESS,
  # LOW/HIGH_TURNOVER, SELF_CORRELATION, LOW_SUB_UNIVERSE_SHARPE); the numbers above apply
  # only when it does not. Our overfitting (auditor), pool-diversity and risk checks are
  # computed and recorded in the decision but never reject an alpha or hold it pending.
  brain_checks_only: true
  # BRAIN checks that are about submitting, not about the alpha, so never gates: the daily
  # submission quota (REGULAR_SUBMISSION, limit 4), theme/pyramid/competition matches,
  # Osmosis allocation, and the Power Pool description and correlation (which apply to
  # Power Pool submissions only; OQ-17, builder default, owner to confirm).
  brain_checks_ignored:
    - REGULAR_SUBMISSION
    - MATCHES_THEMES
    - MATCHES_PYRAMID
    - MATCHES_COMPETITION
    - OSMOSIS_ALLOCATION
    - POWER_POOL_DESCRIPTION_LENGTH
    - POWER_POOL_DESCRIPTION_FORMAT
    - POWER_POOL_CORRELATION

# Per-region gate overrides, keyed REGION or REGION/D<delay> (the second wins); only the
# five gate limits above may be set. Empty: BRAIN's own limits (limits_from_brain) already
# differ per region and delay. Use this only for a limit BRAIN does not report, or to be
# stricter than BRAIN somewhere, e.g.
#   regions:
#     USA/D0: {sharpe_min: 2.0}
regions: {}

# Risk manager (policy choices, owner must set. null = not configured)
risk:
  max_drawdown: null              # OQ-4
  weight_concentration_max: null  # OQ-4
  leg_balance_min_ratio: null     # OQ-5, min(long,short)/max(long,short)
  top_n_pnl_days_removed: 10      # from the application's OS/IS robustness list
  min_sharpe_after_top_pnl_removal: null   # OQ-5
  weak_year_sharpe_floor: null    # OQ-6
  max_yearly_sharpe_spread: null  # OQ-6
  stress_windows: []              # optional list of [start_date, end_date], informational only

# Diversity
diversity:
  max_pool_correlation: 0.70
  min_marginal_pool_sharpe_gain: null   # OQ-7

# Overfitting auditor
auditor:
  os_is_ratio_floor: null         # OQ-8
  deflation_method: "expected_max_normal"   # documented in auditor.py
  # Overfitting guard (owner 2026-11-04: ensure no overfitting; values are builder defaults,
  # OQ-16). An accept is rejected unless its Sharpe, deflated for the number of trials
  # (auditor.py), stays above min_deflated_sharpe. trials_scope: lineage (its repair
  # family) | dataset (every simulation on its dataset) | all.
  min_deflated_sharpe: 0.0
  trials_scope: dataset

# Holdout (must be set before any simulation runs). Owner's choice (2026-11-03): follow
# BRAIN's default. Our account simulates in-sample 2014-01-01..2023-12-31 at consultant
# level (2019-01-01..2023-12-31 at user level) and keeps the time after that as its own
# hidden out-of-sample period, so the holdout starts the day after BRAIN's in-sample ends. The end date is the day it was set; move it forward as
# time passes. No testPeriod is sent (OQ-12). The simulator rejects any BRAIN result whose
# simulated period overlaps this, in case BRAIN moves its default period.
holdout:
  start_date: "2024-01-01"        # OQ-9
  end_date: "2026-11-03"

# Repair (OQ-15, builder defaults 2026-11-04; owner to review). A failed Sharpe or fitness
# gate goes to the Repair Agent only when the failed value reaches this share of the gate's
# threshold, by absolute value (so -0.9 counts as close: a sign flip can rescue it). Further
# away it is rejected, so repairs are spent on near misses. null = no limit.
repair:
  near_miss_share:
    sharpe: 0.6     # Sharpe |value| >= 0.6 x sharpe_min (0.95 with sharpe_min 1.58)
    fitness: 0.5    # fitness |value| >= 0.5 x fitness_min
    recent_sharpe: 0.6   # LOW_2Y_SHARPE / IS_LADDER_SHARPE value >= 0.6 x BRAIN's limit (OQ-18)
  # BRAIN's risk-neutralized Sharpe at least this much above the raw Sharpe sends a failed
  # Sharpe to the factor neutralization levers first (builder default 2026-11-12, OQ-20;
  # null = off). A negative raw Sharpe that is a near miss goes to flip_sign first.
  risk_neutralized_gap: 0.5

# Simulator
simulator:
  max_poll_seconds: 1200   # GLB simulations took over 600 s (run rs20261111162604)
  poll_interval_seconds: 5
  max_retries: 3
  max_concurrent: 8               # simulations on BRAIN at once (owner 2026-11-14: 8 ran together
                                  # with no 429). OQ-3: the account's real limit may be higher;
                                  # over it BRAIN answers 429 and the client waits for a slot
