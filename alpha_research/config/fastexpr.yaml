# Fast Expression language spec used by fastexpr.py to validate generated alphas.
#
# Checked against our account's operator list (`cli brain operators`): 66 operators at
# user level (2026-11-03; OQ-10), 82 after the upgrade to consultant (2026-11-10; the 16
# added are marked "consultant"). Every operator here exists on BRAIN for this account, with the
# argument list from BRAIN's own definitions. Rerun `cli brain operators` if the account
# level changes, since BRAIN shows different operators at different levels. The validator
# is strict on purpose: an operator missing from this file makes the generator discard the
# expression. Correct the list here, never in code.
#
# Each operator is written as its signature. Arguments written as name=default are
# optional. A trailing "..." means any number of further arguments. Arity is derived from
# the signature, so there is one source of truth.

operators:
  # time series
  - ts_mean(x, d)
  - ts_std_dev(x, d)
  - ts_sum(x, d)
  - ts_delta(x, d)
  - ts_delay(x, d)
  - ts_rank(x, d, constant=0)
  - ts_zscore(x, d)
  - ts_corr(x, y, d)
  - ts_covariance(y, x, d)
  - ts_decay_linear(x, d, dense=false)
  - ts_arg_max(x, d)
  - ts_arg_min(x, d)
  - ts_product(x, d)
  - ts_av_diff(x, d)
  - ts_backfill(x, lookback, k=1)
  - ts_scale(x, d, constant=0)
  - ts_quantile(x, d, driver=gaussian)
  - ts_regression(y, x, d, lag=0, rettype=0)
  - ts_count_nans(x, d)
  - ts_step(d)
  - kth_element(x, d, k, ignore="NaN")
  - days_from_last_change(x)
  - last_diff_value(x, d)
  - ts_max(x, d)                  # consultant
  - ts_min(x, d)                  # consultant
  - jump_decay(x, d, sensitivity=0.5, force=0.1)                                 # consultant
  - ts_target_tvr_decay(x, lambda_min=0, lambda_max=1, target_tvr=0.1)           # consultant
  - ts_target_tvr_delta_limit(x, y, lambda_min=0, lambda_max=1, target_tvr=0.1)  # consultant
  # cross sectional
  - rank(x, rate=2)
  - zscore(x)
  - scale(x, scale=1, longscale=1, shortscale=1)
  - normalize(x, useStd=false, limit=0.0)
  - winsorize(x, std=4)
  - quantile(x, driver=gaussian, sigma=1.0)
  - scale_down(x, constant=0)     # consultant
  - vector_neut(x, y)             # consultant
  # group
  - group_neutralize(x, group)
  - group_rank(x, group)
  - group_zscore(x, group)
  - group_scale(x, group)
  - group_mean(x, weight, group)
  - group_backfill(x, group, d, std=4.0)
  - group_max(x, group)           # consultant
  - group_min(x, group)           # consultant
  - group_cartesian_product(g1, g2)   # consultant
  # bucket takes one of range="start, end, step" or buckets="2,5,6" (quoted); the defaults
  # below are placeholders because a signature default cannot contain a comma
  - bucket(x, range=none, buckets=none, skipBoth=false, NaNGroup=false)
  # arithmetic (the infix forms + - * / do the same)
  - add(x, y, ...)
  - subtract(x, y, filter=false)
  - multiply(x, y, ...)
  - divide(x, y)
  # math and logic
  - abs(x)
  - sign(x)
  - log(x)
  - sqrt(x)
  - reverse(x)
  - inverse(x)
  - power(x, y)
  - signed_power(x, y)
  - min(a, b, ...)
  - max(a, b, ...)
  - if_else(cond, a, b)
  - and(a, b)
  - or(a, b)
  - not(x)
  - equal(a, b)
  - not_equal(a, b)
  - greater(a, b)
  - greater_equal(a, b)
  - less(a, b)
  - less_equal(a, b)
  - trade_when(trigger, alpha, exit)
  - is_nan(x)
  - to_nan(x, value=0, reverse=false)   # consultant
  - densify(x)
  - hump(x, hump=0.01)
  - vec_avg(x)
  - vec_sum(x)
  - vec_count(x)                  # consultant
  - vec_max(x)                    # consultant
  - vec_min(x)                    # consultant
  - vec_range(x)                  # consultant
  - vec_stddev(x)                 # consultant

# Group identifiers that may be passed to group_* operators.
groups: [sector, industry, subindustry, market, exchange, country]

# Datafields that are always accepted. Everything else must come from the datafield
# catalog the user supplies (--datafields). Without a catalog, other names are accepted
# with a warning because they cannot be checked.
base_fields: [close, open, high, low, volume, vwap, returns, cap, adv20]

# BRAIN's limit on operators in one alpha, counting every function call and every
# arithmetic or comparison operator ("Expression with 66 operators exceeds limit of 64",
# 2026-11-14; this count reproduced BRAIN's 66, 66 and 71). null = not checked.
max_operators: 64

# Names BRAIN refuses as variable names ('Attempted to use reserved variable name: "delta"',
# 2026-11-14). Add each new one BRAIN reports.
reserved_names: [delta]

# Bare words that are values, not datafields.
# BRAIN's own docs write both true/false and True/False.
constants: ["nan", "true", "false", "True", "False", "gaussian", "uniform", "cauchy"]
