# Settings for the agents that run around the Generator in `cli research` (research.py).
# None of these changes an accept or reject decision: the gates, risk and diversity checks
# in config/thresholds.yaml still decide that. These only decide which candidates are worth
# a BRAIN simulation and how the model is used.
#
# Values marked OQ-13 are builder defaults chosen so the loop works out of the box. The
# owner should review them.

prefilter:
  near_duplicate_similarity: 0.9   # OQ-13: term-set Jaccard vs memory; null = check off
  use_model: false                 # true = one model call per batch scores candidates 0-10
  min_model_score: null            # null = scores only recorded; a number drops lower scores

critic:
  use_model: true                  # false = rule checks only
  # Fields with a value on few days: a fresh alpha that feeds one into a ts_* operator
  # without ts_backfill is revised to ts_backfill(field, lookback) by the rule check (run
  # rs20261112054223: JPN sentiment z-scores had half the book in one stock). Category = the
  # catalog's dataset category. Builder defaults 2026-11-12 (OQ-20). Remove the block = off.
  sparse_fields:
    categories: [news, sentiment, socialmedia]
    coverage_below: 0.5
    lookback: 20
  # A fresh alpha that reads only base fields and fields of these dataset categories gets an
  # advisory: price/volume-only signals are the most common production alphas (EUR reversal
  # rescues 2026-11-15: PROD_CORRELATION 0.70-0.76 however reshaped, 0.645 once blended 1:1
  # with analyst revisions). Builder default 2026-11-15. Empty list = advisory off.
  price_volume_categories: [pv]

# Lesson Writer (lessons.py): after every research run and every `cli run` batch, evidence
# from all of memory (what each change did to each BRAIN check, production correlation by
# the data an alpha reads, failures per region and data category) becomes lessons that the
# next run's Generator and Repair Agent read. Rewritten from all of memory each time, so a
# lesson later evidence contradicts is replaced. Advice only: no decision changes. The
# research run uses the strategy model (one call, within --max-llm-calls) and falls back to
# rule-written lessons; `cli run` writes rule lessons. Builder defaults 2026-11-15 (OQ-22).
# Arm Designer (arm_designer.py, owner 2026-11-26; builder defaults OQ-24): at a run's start,
# each market of the run gets its arms from the pipeline instead of the research plan. A new
# batch is written only when every arm of the market's previous batch is done
# (done_after_alphas new alphas on its dataset reached BRAIN since the batch was written,
# all models together). Datasets come from the market's field catalog, scored on BRAIN's
# value score, how few BRAIN alphas use it, its signal fields, our best Sharpe on it there,
# whether we never tried it, and our PROD_CORRELATION failures on it; explore_arms of each
# batch are never-tried datasets, then one per data category. Decay and neutralization come
# from our near misses on that category of data in the market (settings_evidence of them),
# else decay_by_category and the plan's neutralization. Hypotheses are briefs from BRAIN's
# dataset and field descriptions (no model call). The plan still gives the markets, their
# catalogs, base settings (universe, truncation, dates) and seeds. enabled: false = the
# plan's arms, as before.
# Blend Planner (blend_planner.py, owner 2026-11-26; builder defaults OQ-25): a lead within
# max_distance of accept that fails an information class gets a model-planned repair wave of
# blends with partner signals from other datasets (3 of our 5 accepts were such blends, made
# by hand). Partner candidates are scored by fit to the alpha (PnL correlation with it and
# with our submitted pool alphas, strength in its weak years, own Sharpe, usage, coverage);
# the repair model plans blends with a stated mechanism, a critic model from another maker
# reviews them. A blend's partner must be proven (our alpha on that dataset reached
# min_partner_sharpe, or a partner-alone test did); an untested one gets a partner-alone
# test first. Directions are never flipped; weights from `weights`; at most
# max_partners_per_lineage partner datasets per lineage; blends are built on the lineage's
# last non-blend alpha (two parts at most). A blend that beats its base in fewer than
# stable_year_share of the years is flagged (decisions unchanged). enabled: false = off.
blend_plan:
  enabled: true
  classes: [prod_correlation, self_correlation, sharpe, recent_sharpe, sub_universe]
  max_distance: 0.4
  max_candidates: 10
  fields_per_candidate: 8
  exclude_categories: [pv, risk]
  min_coverage: 0.3
  min_partner_sharpe: 0.5
  weights: [1, 2]
  max_partners_per_lineage: 4
  partner_alone_per_wave: 1
  min_overlap_days: 120
  min_mechanism_chars: 40
  stable_year_share: 0.5
  review: true
  min_field_alphas: 5               # fields/datasets read by fewer BRAIN alphas: listed last, no usage bonus
  family_items: 3                   # revision families listed first per partner dataset
# Breadth blends (breadth.py, owner 2026-11-27): five of our seven accepts were the near miss
# blended with analyst net revision breadth ((up - down) / count, a few less-used items),
# all made by hand; the pipeline never wrote one. A lead within max_distance of accept that
# fails one of `classes` gets these blends first in its repair wave, built by rule (no model
# call): revision families found by field id in `categories` datasets of its market, the
# least-used items (items under min_item_alphas last) at each weight, then the next items.
breadth_blend:
  enabled: true
  classes: [prod_correlation, self_correlation, sharpe, recent_sharpe, sub_universe]
  max_distance: 0.4
  items_per_variant: 3
  min_items: 2
  weights: [1, 2]
  variants_per_wave: 2
  max_per_lineage: 4
  backfill_below_coverage: 0.5
  backfill_days: 20
  categories: [analyst]
  min_item_alphas: 5
designer:
  enabled: true
  arms_per_batch: 4
  done_after_alphas: 6
  explore_arms: 1
  # exploit (owner 2026-11-26): every batch first keeps the dataset with our best |Sharpe|
  # in the market (>= exploit_min_share x BRAIN's Sharpe bar), designed before or not: all
  # five accepts came from near misses, and little-used data often gives Sharpe ~0
  exploit_arms: 1
  exploit_min_share: 0.6
  min_signal_fields: 5
  weights: {value: 1.0, uncrowded: 1.0, fields: 0.5, evidence: 1.0, novelty: 0.5, prod: 1.0}
  decay_by_category: {pv: 4, analyst: 5, earnings: 5, fundamental: 6, model: 6, default: 6}
  settings_evidence: 3
  near_distance: 0.6
  # dead datasets (owner 2026-11-27): 12 new alphas in a market, best |Sharpe| (raw or
  # risk-neutralized) below 0.3 x bar -> no more slots for its arms, never designed again.
  # Was 5; owner (same day): a few weak alphas do not make a dataset dead, wait 10-15
  dead_after_alphas: 12
  dead_sharpe_share: 0.3
lessons:
  after_every_batch: true
  use_model: true
  min_evidence: 3                  # alphas per group before it becomes a lesson
  max_lessons: 12
  max_prompt_chars: 12000          # evidence sent to the model (Groq's free plan: 8,000 tokens a minute)
  catalog_plan: config/research_plan.v4.yaml   # catalogs for data categories outside a run

debate:
  use_model: true                  # false = the critic's verdict stands

repair:
  use_model: true                  # for levers with no mechanical rewrite (orthogonalize, ...)
  # Lever learning (lever_stats.py). Builder defaults 2026-11-04; none changes a decision.
  order: learned                   # learned (posterior mean from memory) | thompson | playbook
  secondary_weight: 0.5            # weight of a lever's record for the alpha's other failing classes
  prior: [1, 1]                    # Beta prior per (failure class, lever)
  examples_in_prompt: 3            # past repairs that worked, shown to the repair model
  resume_from_memory: true         # at start, re-repair parents whose child was never simulated
  max_resume: 3                    # ... at most this many, closest to accept first (repairs a recheck just decided first)
  # close leads of regions outside this run's rotation are resumed anyway (owner 2026-11-28:
  # an IND alpha at distance 0.13 waited two days for IND's turn); their arms take repairs
  # only, no new alphas. null distance or 0 leads = off
  cross_region_distance: 0.15
  cross_region_leads: 2
  recheck_every_rounds: 2          # alphas waiting on BRAIN's late checks (PROD_CORRELATION) fetched again every 2 rounds; a new repair starts its wave at once (0 = run start only)
  max_share_per_round: 1.0         # queued repairs take up to this share of a round's slots first
  # Repair waves (owner 2026-11-23): a near miss gets fixes_per_wave different fixes (one
  # per kind of change first) simulated together; when all are back, the next wave starts
  # from the best child if it got closer to accept, else from the same parent with its next
  # levers. Two waves of 4 fill one BRAIN batch of 8; with --per-round 12 a round is 8
  # repairs + 4 new alphas. Model calls are the scarce budget: at most
  # model_levers_per_wave model-written fixes per wave, the rest are mechanical.
  fixes_per_wave: 4
  waves_per_round: 2               # repair waves a round may start (first, or in freed slots)
  fill_freed_slots: true           # owner 2026-11-23: each alpha is decided as it finishes; a
                                   # ready wave takes a BRAIN slot freed mid-batch at once
  model_levers_per_wave: 1
  # Part tests (owner 2026-11-26, legs.py): a wave of an alpha that combines parts (a sum of
  # signals or a product of factors) also simulates each part alone, at most this many
  # parts, once per lineage, on top of the wave's fixes (no model call). Then reweight_legs
  # (a model lever) sees what each part did and drops or reweights the weak one. 0 = off.
  leg_tests: 3
  # Feasibility (feasibility.py, owner 2026-11-27; numbers from memory, builder defaults):
  # a lever that cannot close the alpha's gap is left out of its wave. Mechanical levers on
  # a Sharpe failure: median x0.97, never above x1.07 (20 children); neutralizations x1.3+
  # only where BRAIN's risk-neutralized Sharpe was high; size tilts never raised the
  # sub-universe Sharpe (13 children, at most +0.06).
  feasibility:
    enabled: true
    max_mechanical_sharpe_gain: 0.10   # Sharpe needing more than x1.10: no mechanical lever
    rn_support_share: 0.9              # ... a neutralization only if risk-neutralized >= 0.9 x bar
    tilt_levers: [size_tilt, liquidity_tilt, change_universe]
    tilt_margin: 1.0                   # tilts only if sub-universe Sharpe >= limit share x bar
    max_mechanical_sub_gain: 0.10      # other reshapes only within 0.10 of that floor
    blend_min_parent_ratio_share: 0.5  # no blend onto an alpha whose own sub-universe ratio < 0.5 x limit share
    weak_part_ratio_share: 0.6         # drop_weak_legs: part ratio below 0.6 x limit share is weak
    weak_part_sharpe_share: 0.5        # ... or Sharpe alone below 0.5 x the best part
    strong_part_share: 0.9             # ... when the best part alone has >= 0.9 x the whole's Sharpe
  # Wave size by how close and how real the alpha is (owner 2026-11-23: many fixes only for
  # alphas that are really close and have value). Distance to accept = sum of each failing
  # check's normalized shortfall (lever_stats.distance). In memory on 2026-11-23 both
  # accepts came from parents at distance <= 0.1, while most run repairs were at 1-7.
  # Owner 2026-11-23: tight, since model calls and simulations are scarce; far, low-edge
  # and blocked alphas get no fix at all (the decision stays "repair", nothing is queued).
  # On memory: 21 alphas get 4, 22 get 2, 53 get 0; both accepts' parents (distance 0.1
  # and 0.0) keep 4.
  # Owner 2026-11-25 (run rs20261125111614: 8 repair decisions, all 0.66-3.7 away, none
  # fixed): 0.4-0.6 away gets mechanical fixes only (no model call; simulations were not the
  # limit), more than 0.6 away nothing.
  wave_tiers:
    - {max_distance: 0.15, fixes: 4}
    - {max_distance: 0.4, fixes: 2}
    - {max_distance: 0.6, fixes: 2, mechanical_only: true}
    - {max_distance: null, fixes: 0}
  value_sharpe_share: 0.8          # best Sharpe (raw or risk-neutralized) below 0.8 x the bar:
  low_value_fixes: 0               # ... no fix (little real edge)
  blocked_fixes: 0                 # fails a BRAIN check no lever fixes (e.g. ASI checks): no fix
  # Leads (owner 2026-11-25): an alpha whose best Sharpe (raw or risk-neutralized, either
  # sign) is at least lead_sharpe_share x BRAIN's Sharpe bar (0.63 x 1.58 = 1.0 in USA; the
  # bar differs by region) gets at least lead_fixes mechanical fixes (no model call), however
  # far its other checks put it, unless it fails a check no lever fixes. Run
  # rs20261125130750: 43 simulations, leads at Sharpe 1.05-1.39, no repair child at all.
  # Alphas the evaluator rejects (a Sharpe/fitness/recent-Sharpe failure that is not a near
  # miss) still get none: this sizes waves of "repair" decisions only.
  lead_sharpe_share: 0.63
  lead_fixes: 2
  # Gain match (owner 2026-11-23): a lever's past gains count for an alpha that needs less,
  # even when they never carried an alpha over the bar.
  gain_weight: 0.5                 # weight of P(past gain >= the gain this alpha needs)
  min_gain_evidence: 2             # past gains a (class, lever) needs before it is used
  # Lineage budget. Owner 2026-11-23: BRAIN's checks decide; overfitting checks only raise a
  # flag, so the budget is a cost limit now, not an overfitting guard (was 2 / 4 / 2).
  max_depth: 3                     # repair generations below the original candidate
  max_trials_per_root: 12          # repair simulations per original candidate (3 waves of 4)
  patience: 8                      # stop after this many children that do not get closer (2 waves)
  # Per region (2026-11-11, OQ-18): lever estimates are also kept per region, starting from
  # the all-region estimate worth this many repairs, so each region learns its own order.
  region_prior_strength: 2
  unmeasured_failure_penalty: 0.5  # distance to accept added by a failure with no value

strategy:
  every_rounds: 2                  # OQ-13: evolve after every 2nd round; 0 = never
  max_hypotheses: 3                # new hypotheses proposed per evolution
  max_guidance_chars: 1500
  # An evolution updates only the arms of the regions in this run: each evolved arm replaces
  # its parent and starts from the parent's record. Arms for datasets no arm covers are
  # capped here, spread over datasets, markets and generator models (2026-11-14: one
  # evolution had added 140 arms to a 20-simulation run).
  max_new_arms: 8
  # Whole prompt (instructions + records) cut to about this many characters, least useful
  # records first (strategy.trimmed_summary). Run rs20261125130750: an ~11,000-token Strategy
  # request was refused by gpt-oss (8,000 tokens a minute) and Qwen (7,000) and, before the
  # fix that keeps a model up after a too-large request, took both down for the run. 15,000
  # characters is ~6,000 tokens at 2.5 characters a token (field-heavy text). null = no cut.
  max_prompt_chars: 15000

director:
  floor_share: 0.2                 # spec 13.1 default: share of each round reserved as floor slots
  max_arm_share: 0.4               # no arm gets more than this share of a round while others are below it
  refill_passes: 1                 # slots emptied by Pre-Filter/Critic drops go back to the Director this many extra times per round (slots of a model that went down always do)
  # Owner 2026-11-25: run rs20261125111614 spent 60 model calls on 24 alphas, since 12 slots
  # went to 12 arms and each arm's single alpha cost a Generator and a Critic call. An arm
  # given slots now gets at least min_batch (one Generator call writes them all).
  min_batch: 3
  # Owner 2026-11-26: the round's new-alpha allocation is made before its repairs go to
  # BRAIN, and a slot freed mid-batch generates the next arm's alphas at once (one Generator
  # call per arm, as before). Run rs20261125173606: new alphas waited ~30 min twice for a
  # repair batch's timeouts while 2 of 4 slots sat idle. false = generate after the batch.
  fill_freed_slots: true
  # With no model-call cap (--max-llm-calls is optional since 2026-11-25) a run ends when
  # every generator model is down (its free limit), the simulation budget or the rounds; this
  # many rounds in a row that send nothing to BRAIN end it too.
  stop_after_idle_rounds: 2
  # Loop guard (owner 2026-11-26, after a round looped through 9 refill passes until stopped
  # by hand): the run stops cleanly (queued alphas still go out, report and lessons are
  # written) when no alpha went to or came back from BRAIN for stall_minutes, or
  # stall_model_calls model calls were spent since the last alpha went to BRAIN. A BRAIN
  # result takes at most simulator.max_poll_seconds (30 min); a round of 12 new alphas costs
  # ~10-25 calls. null = off.
  stall_minutes: 60
  stall_model_calls: 40
  # Regions (consultant level, builder defaults 2026-11-11, OQ-18): each region in the plan
  # gets at least floor(region_floor_share x slots / n_regions) slots per round, and none
  # gets more than max_region_share of a round while another region is below it.
  region_floor_share: 0.5
  max_region_share: 0.6
  # Region rotation (owner 2026-11-11: each run covers a few regions, the next run others,
  # all regions equal across runs; builder defaults, OQ-19): a run works on the
  # regions_per_run plan regions with the fewest simulations since region_balance_since,
  # and each slot goes to the chosen region with the fewest so far, so a region that fell
  # short is picked again. Within a region the Director picks arms as usual. null = every
  # region in every run (region_floor_share and max_region_share apply only then).
  regions_per_run: 3
  region_balance_since: "2026-11-11"

max_output: 4096                   # output cap for one model call

# Model per agent. The provider comes from the model id (claude-*, gemini-* or a hosted
# id; the key for each is read in llm.py, see README). A null entry uses models.default;
# `cli research --model M` replaces models.default wherever it is used.
#
# Owner's choice: free API keys only (2026-11-03); no Mistral, add GPT, Llama and DeepSeek
# (2026-11-04). Hosted ids: <host>:<maker>/<model>, or <host>:<model> when the name says the
# maker (groq:gpt-oss-120b). Hosts: groq, nvidia (build.nvidia.com), cerebras (bare names
# such as cerebras:gpt-oss-120b; no permanent free tier since 2026, a 30-day trial credit)
# and OpenRouter for a plain <maker>/<model>; each host's key variable is listed in README.
# GitHub Models was retired on 2026-07-30 (github: ids fail with that reason).
# Ids change often: before a run, `cli models --host nvidia --filter deepseek` lists what a
# host serves and `cli models --check` sends one tiny call to every model below. A model
# that fails during a run is dropped for the rest of it (research.py), so one bad id or
# spent quota does not stop the run.
# Load is spread so Gemini's 20 calls/day go only to its own generator arm and the
# last-resort critic: the agents that run every round and Strategy use gpt-oss on Groq
# (about 1,000 calls/day). NVIDIA (Llama, DeepSeek) is left out: on 2026-11-04 its chat
# endpoint answered nothing in 120 s, even to plain curl, while its model list worked. To
# retry later, add nvidia:meta/llama-3.2-90b-vision-instruct and
# nvidia:deepseek-ai/deepseek-v4.1-flash back and run `cli models --check`.
models:
  default: groq:gpt-oss-120b
  generator:                       # every generator model is its own Director arm
    - gemini-3.6-flash
    - groq:qwen/qwen3.8-27b
    - groq:gpt-oss-120b            # the open-weight GPT model (ChatGPT's own API has no free tier)
    - nvidia/nemotron-3.5-lightning:free       # OpenRouter (~50 free calls/day for all its
                                               # free models): generator only. Replaced
                                               # nemotron-3-ultra (empty replies) 2026-11-23;
                                               # first test: 3 valid, 0 rejected at a 16k cap
    - baidu/ernie-5.5-flash-preview:free       # OpenRouter, shares the 50/day; new maker.
                                               # Test 2026-11-23: 3 valid, 0 rejected (16k cap)
  # An arm's primary critic is a critic from another maker than its generator that is up.
  # critic_pick balanced (owner 2026-11-23): the one with the fewest calls so far this run,
  # so the reviews spread over the critics (run rs20261123174845: gpt-oss reviewed 4 of 5
  # arms and was also judge, repair, strategy and default, and hit Groq's per-minute limit
  # within the first round); first = the first listed.
  critic_pick: balanced
  critic:
    - groq:gpt-oss-120b
    - groq:qwen/qwen3.8-27b
    - nvidia/nemotron-3.5-lightning:free     # OpenRouter (shares the ~50 free calls a day)
    - gemini-3.6-flash
  shadow_critics: false            # true = the other critics review every batch too (recorded only)
  prefilter: null
  debate: null                     # contested alphas only: rare
  repair: groq:qwen/qwen3.8-27b    # was the default (gpt-oss); at most one call per repair wave
  strategy: groq:gpt-oss-120b
  # Free-tier limits each model's calls are paced to (llm.PacedClient waits before a call
  # instead of collecting 429s; a call's tokens are what the host reports, reasoning
  # included). Builder values 2026-11-23 from the limits the hosts reported before (Groq:
  # 8,000 tokens a minute for gpt-oss, 7,000 for Qwen; Gemini free Flash about 10 calls a
  # minute; OpenRouter free models 20 calls a minute): check console.groq.com (Settings ->
  # Limits) and aistudio.google.com/rate-limit, and lower a value if 429s still appear.
  # Keys: calls_per_minute, tokens_per_minute, output_tokens_per_minute (Groq's OTPM; the
  # output cap is kept under it; also learned from the host's "Request too large ... (OTPM)"
  # reply, run rs20261127153052). A 429 that asks to wait at most 30 min pauses the model
  # (research.PAUSE_MAX_SECONDS), longer takes it out for the run; an empty reply is retried
  # once at twice the cap and takes the model out only after 3 in a row.
  pace:
    groq:gpt-oss-120b: {calls_per_minute: 30, tokens_per_minute: 8000}
    groq:qwen/qwen3.8-27b: {calls_per_minute: 30, tokens_per_minute: 7000}
    gemini-3.6-flash: {calls_per_minute: 10}
    nvidia/nemotron-3.5-lightning:free: {calls_per_minute: 20}
    baidu/ernie-5.5-flash-preview:free: {calls_per_minute: 20}
  # Per-model output cap: replaces the agents' cap (max_output above, generator.yaml's for
  # the Generator) on every call to that model. Reasoning models think inside the cap and
  # return nothing when it runs out (finish_reason length).
  max_output:
    nvidia/nemotron-3.5-lightning:free: 16384
    baidu/ernie-5.5-flash-preview:free: 16384    # reasoning model: empty at 4096 (2026-11-23)
