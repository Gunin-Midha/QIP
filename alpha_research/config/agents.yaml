# Settings for the agents that run around the Generator in `cli research` (research.py).
# None of these changes an accept or reject decision: the gates, risk and diversity checks
# in config/thresholds.yaml still decide that. These only decide which candidates are worth
# a BRAIN simulation and how the model is used.
#
# Values marked OQ-13 are builder defaults chosen so the loop works out of the box. The
# owner should review them.

prefilter:
  near_duplicate_similarity: 0.9   # OQ-13: term-set Jaccard vs memory; null = check off
  use_model: false                 # true = one model call per batch scores candidates 0-10
  min_model_score: null            # null = scores only recorded; a number drops lower scores

critic:
  use_model: true                  # false = rule checks only

debate:
  use_model: true                  # false = the critic's verdict stands

repair:
  use_model: true                  # for levers with no mechanical rewrite (orthogonalize, ...)

strategy:
  every_rounds: 2                  # OQ-13: evolve after every 2nd round; 0 = never
  max_hypotheses: 3                # new hypotheses proposed per evolution
  max_guidance_chars: 1500

director:
  floor_share: 0.2                 # spec 13.1 default: share of each round reserved as floor slots

max_output: 4096                   # output cap for one model call

# Model per agent. The provider comes from the model id (claude-* or gemini-*; the key for
# each is read in llm.py, see README). A null entry uses models.default; `cli research
# --model M` replaces models.default wherever it is used. Check the gemini ids against Google's current
# model list before a real run (they change often).
models:
  default: claude-sonnet-5-5
  generator:                       # every generator model is its own Director arm
    - claude-opus-5-5
    - gemini-3.1-pro-preview
  critic:                          # preference order; an arm's primary critic is the first one
    - gemini-3.1-pro-preview       # from a different provider than the arm's generator
    - claude-opus-5-5
  shadow_critics: true             # the other critics review every batch too (recorded only)
  prefilter: null
  debate: null
  repair: null
  strategy: claude-opus-5-5
