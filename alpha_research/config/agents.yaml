# Settings for the agents that run around the Generator in `cli research` (research.py).
# None of these changes an accept or reject decision: the gates, risk and diversity checks
# in config/thresholds.yaml still decide that. These only decide which candidates are worth
# a BRAIN simulation and how the model is used.
#
# Values marked OQ-13 are builder defaults chosen so the loop works out of the box. The
# owner should review them.

prefilter:
  near_duplicate_similarity: 0.9   # OQ-13: term-set Jaccard vs memory; null = check off
  use_model: false                 # true = one model call per batch scores candidates 0-10
  min_model_score: null            # null = scores only recorded; a number drops lower scores

critic:
  use_model: true                  # false = rule checks only
  # Fields with a value on few days: a fresh alpha that feeds one into a ts_* operator
  # without ts_backfill is revised to ts_backfill(field, lookback) by the rule check (run
  # rs20261112054223: JPN sentiment z-scores had half the book in one stock). Category = the
  # catalog's dataset category. Builder defaults 2026-11-12 (OQ-20). Remove the block = off.
  sparse_fields:
    categories: [news, sentiment, socialmedia]
    coverage_below: 0.5
    lookback: 20

debate:
  use_model: true                  # false = the critic's verdict stands

repair:
  use_model: true                  # for levers with no mechanical rewrite (orthogonalize, ...)
  # Lever learning (lever_stats.py). Builder defaults 2026-11-04; none changes a decision.
  order: learned                   # learned (posterior mean from memory) | thompson | playbook
  secondary_weight: 0.5            # weight of a lever's record for the alpha's other failing classes
  prior: [1, 1]                    # Beta prior per (failure class, lever)
  examples_in_prompt: 3            # past repairs that worked, shown to the repair model
  resume_from_memory: true         # at start, re-repair parents whose child was never simulated
  max_resume: 3                    # ... at most this many, closest to accept first
  max_share_per_round: 0.5         # queued repairs take up to this share of a round's slots first
  # Lineage budget (owner 2026-11-04: repairs must not concentrate on the few near misses;
  # every repair simulation also counts against the alpha in the overfitting check)
  max_depth: 2                     # repair generations below the original candidate
  max_trials_per_root: 4           # repair simulations per original candidate
  patience: 2                      # stop a lineage after this many children that do not get closer
  # Per region (2026-11-11, OQ-18): lever estimates are also kept per region, starting from
  # the all-region estimate worth this many repairs, so each region learns its own order.
  region_prior_strength: 2
  unmeasured_failure_penalty: 0.5  # distance to accept added by a failure with no value

strategy:
  every_rounds: 2                  # OQ-13: evolve after every 2nd round; 0 = never
  max_hypotheses: 3                # new hypotheses proposed per evolution
  max_guidance_chars: 1500
  # An evolution updates only the arms of the regions in this run: each evolved arm replaces
  # its parent and starts from the parent's record. Arms for datasets no arm covers are
  # capped here, spread over datasets, markets and generator models (2026-11-14: one
  # evolution had added 140 arms to a 20-simulation run).
  max_new_arms: 8

director:
  floor_share: 0.2                 # spec 13.1 default: share of each round reserved as floor slots
  max_arm_share: 0.4               # no arm gets more than this share of a round while others are below it
  refill_passes: 1                 # slots emptied by Pre-Filter/Critic drops go back to the Director this many extra times per round (slots of a model that went down always do)
  # Regions (consultant level, builder defaults 2026-11-11, OQ-18): each region in the plan
  # gets at least floor(region_floor_share x slots / n_regions) slots per round, and none
  # gets more than max_region_share of a round while another region is below it.
  region_floor_share: 0.5
  max_region_share: 0.6
  # Region rotation (owner 2026-11-11: each run covers a few regions, the next run others,
  # all regions equal across runs; builder defaults, OQ-19): a run works on the
  # regions_per_run plan regions with the fewest simulations since region_balance_since,
  # and each slot goes to the chosen region with the fewest so far, so a region that fell
  # short is picked again. Within a region the Director picks arms as usual. null = every
  # region in every run (region_floor_share and max_region_share apply only then).
  regions_per_run: 3
  region_balance_since: "2026-11-11"

max_output: 4096                   # output cap for one model call

# Model per agent. The provider comes from the model id (claude-*, gemini-* or a hosted
# id; the key for each is read in llm.py, see README). A null entry uses models.default;
# `cli research --model M` replaces models.default wherever it is used.
#
# Owner's choice: free API keys only (2026-11-03); no Mistral, add GPT, Llama and DeepSeek
# (2026-11-04). Hosted ids: <host>:<maker>/<model>, or <host>:<model> when the name says the
# maker (groq:gpt-oss-120b). Hosts: groq, nvidia (build.nvidia.com), github (GitHub Models:
# the hosted GPT models, ~50 calls/day) and OpenRouter for a plain <maker>/<model>; each
# host's key variable is listed in README.
# Ids change often: before a run, `cli models --host nvidia --filter deepseek` lists what a
# host serves and `cli models --check` sends one tiny call to every model below. A model
# that fails during a run is dropped for the rest of it (research.py), so one bad id or
# spent quota does not stop the run.
# Load is spread so Gemini's 20 calls/day go only to its own generator arm and the
# last-resort critic: the agents that run every round and Strategy use gpt-oss on Groq
# (about 1,000 calls/day). NVIDIA (Llama, DeepSeek) is left out: on 2026-11-04 its chat
# endpoint answered nothing in 120 s, even to plain curl, while its model list worked. To
# retry later, add nvidia:meta/llama-3.2-90b-vision-instruct and
# nvidia:deepseek-ai/deepseek-v4.1-flash back and run `cli models --check`.
models:
  default: groq:gpt-oss-120b
  generator:                       # every generator model is its own Director arm
    - gemini-3.6-flash
    - groq:qwen/qwen3.8-27b
    - groq:gpt-oss-120b            # the open-weight GPT model (ChatGPT's own API has no free tier)
    - nvidia/nemotron-3-ultra-550b-a55b:free   # OpenRouter (~50 free calls/day for all its
                                               # free models): generator only, owner 2026-11-04;
                                               # stands in while no free host serves Llama/DeepSeek
  critic:                          # preference order; an arm's primary critic is the first one
    - groq:gpt-oss-120b            # from a different provider than the arm's generator that
    - groq:qwen/qwen3.8-27b        # is not down
    - gemini-3.6-flash
  shadow_critics: false            # true = the other critics review every batch too (recorded only)
  prefilter: null
  debate: null
  repair: null
  strategy: groq:gpt-oss-120b
